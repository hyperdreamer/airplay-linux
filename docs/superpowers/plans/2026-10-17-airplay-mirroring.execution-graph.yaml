tasks:
  - id: T-001
    plan_task: 1
    title: "Establish packaging and freeze typed domain interfaces"
    lane: foundation
    sequence: 1
    tier: capable
    category: shared-contract
    owns: ["pyproject.toml", ".gitignore", "src/airplay_linux/__init__.py", "src/airplay_linux/domain/__init__.py", "src/airplay_linux/domain/identity.py", "src/airplay_linux/domain/resources.py", "src/airplay_linux/domain/operations.py", "src/airplay_linux/domain/records.py", "src/airplay_linux/domain/messages.py", "src/airplay_linux/domain/ports.py", "tests/domain/test_contracts.py"]
    resources: ["domain-contracts"]
    depends_on: []
    interfaces:
      produces: [I-001]
      consumes: []
    validation:
      - argv: ["python", "-m", "pytest", "-q", "tests/domain"]
        cwd: "."
        timeout_seconds: 600
  - id: T-002
    plan_task: 2
    title: "Supply deterministic adapters and a controllable event laboratory"
    lane: foundation
    sequence: 2
    tier: advanced
    category: test-seams
